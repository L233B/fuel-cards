<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منظومة بطاقات الوقود</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#eef2f6;--sf:#fff;--tx:#0e1b26;--mut:#64768a;--pri:#0f5d82;--pri2:#1a8bb8;--acc:#f59e0b;--ok:#12935a;--bad:#d33b3b;--bd:#dde5ec;--sh:0 6px 20px rgba(15,50,80,.09)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1319;--sf:#16212a;--tx:#e8f0f5;--mut:#8ea2b3;--pri:#2a9fcf;--pri2:#56bde6;--bd:#243542;--sh:0 6px 20px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1319;--sf:#16212a;--tx:#e8f0f5;--mut:#8ea2b3;--pri:#2a9fcf;--pri2:#56bde6;--bd:#243542;--sh:0 6px 20px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:0 14px calc(92px + env(safe-area-inset-bottom,0px));min-height:100vh}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;color:#fff}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.ib:active,.btn:active,.chip:active,.nav button:active{transform:scale(.95)}
.scr{display:none}.scr.on{display:block;animation:in .28s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--sf);border-radius:16px;padding:12px;box-shadow:var(--sh);text-align:center}
.stat b{font-size:24px;display:block;color:var(--pri)}.stat span{font-size:12px;color:var(--mut)}
.box{background:var(--sf);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
h2{font-size:16px;margin:0 0 12px}
label{display:block;font-size:12.5px;color:var(--mut);margin:12px 0 5px}
input{width:100%;padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(26,139,184,.18)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font:inherit;font-weight:700;cursor:pointer;transition:transform .15s;margin-top:14px}
.btn.alt{background:var(--bg);color:var(--tx);border:1.5px solid var(--bd)}
.btn.bad{background:var(--bad)}
.row{display:flex;gap:10px}.row .btn{margin-top:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 14px;border-radius:999px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:13px;cursor:pointer;transition:transform .15s,background .2s}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--bd);cursor:pointer;transition:transform .15s}
.sw.on{border-color:var(--pri2);transform:scale(1.15)}
.dots{display:flex;gap:6px;margin-bottom:12px}.dots i{flex:1;height:5px;border-radius:9px;background:var(--bd);transition:background .3s}.dots i.on{background:var(--pri2)}
.hide{display:none!important}
/* card */
.card{position:relative;border-radius:20px;padding:16px;color:#fff;overflow:hidden;background:linear-gradient(135deg,#08364d 0%,#0f5d82 55%,#1a8bb8 100%);box-shadow:0 14px 30px rgba(8,54,77,.35);aspect-ratio:1.62;display:flex;flex-direction:column;justify-content:space-between}
.card:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;left:-70px;top:-110px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.card:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--acc),#fbbf24)}
.card .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;position:relative}
.card .top b{display:flex;align-items:center;gap:6px;font-size:13px}
.card .mid{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;position:relative}
.card .no{font:700 clamp(15px,5vw,20px) ui-monospace,Consolas,monospace;direction:ltr;letter-spacing:1.5px;margin-bottom:6px}
.card .nm{font-size:15px;font-weight:700}.card .sub{font-size:11.5px;opacity:.85;line-height:1.7}
.qr{background:#fff;padding:5px;border-radius:10px;line-height:0;flex:none}
.qr img,.qr canvas{width:76px!important;height:76px!important}
.chipc{width:34px;height:26px;border-radius:6px;background:linear-gradient(135deg,#fde68a,#f59e0b);display:inline-block;margin-bottom:6px}
/* list */
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.av{width:42px;height:42px;border-radius:13px;background:rgba(26,139,184,.14);color:var(--pri2);display:grid;place-items:center;flex:none}
.item .t{flex:1;min-width:0}.item .t b{display:block;font-size:14px}.item .t small{color:var(--mut);direction:ltr;display:inline-block;font-size:11.5px}
.bd{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:700}
.bd.ready{background:rgba(18,147,90,.15);color:var(--ok)}.bd.wait{background:rgba(245,158,11,.18);color:#c77d05}.bd.frozen{background:rgba(211,59,59,.15);color:var(--bad)}
.acts{display:flex;gap:6px}.acts .ib{width:34px;height:34px;border-radius:10px}
.empty{text-align:center;color:var(--mut);padding:22px 0;font-size:14px}
/* scanner */
.vf{position:relative;aspect-ratio:1;border-radius:20px;background:#0a1218;overflow:hidden;display:grid;place-items:center;color:#6f8798}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf .c{position:absolute;width:34px;height:34px;border:4px solid var(--acc);border-radius:8px}
.c1{top:16px;right:16px;border-left:0;border-bottom:0}.c2{top:16px;left:16px;border-right:0;border-bottom:0}.c3{bottom:16px;right:16px;border-left:0;border-top:0}.c4{bottom:16px;left:16px;border-right:0;border-top:0}
.line{position:absolute;left:12%;right:12%;top:0;height:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 14px var(--acc);animation:sc 2.2s ease-in-out infinite alternate;will-change:transform}
@keyframes sc{from{transform:translate3d(0,24px,0)}to{transform:translate3d(0,calc(min(100vw,520px) - 90px),0)}}
.gap{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:10px 14px;border-radius:14px;background:var(--bg)}
.gap .ib{width:36px;height:36px}.gap b{font-size:18px;min-width:70px;text-align:center}
/* sheet */
.bk{position:fixed;inset:0;background:rgba(6,14,20,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}.bk.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--sf);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translate3d(0,105%,0);transition:transform .35s cubic-bezier(.2,.9,.25,1);max-height:90vh;overflow:auto;will-change:transform;max-width:560px;margin:0 auto}.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--bd);margin:-6px auto 14px}
.big{display:grid;place-items:center;width:68px;height:68px;border-radius:50%;margin:0 auto 10px;color:#fff;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.big svg{width:34px;height:34px}.big.ok{background:var(--ok)}.big.no{background:var(--bad)}
.rs{text-align:center}.rs h3{margin:0 0 6px;font-size:19px}.rs p{margin:4px 0;color:var(--mut);font-size:13.5px;line-height:1.7}
/* nav */
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:6px;box-shadow:0 10px 30px rgba(10,40,60,.2);max-width:560px;margin:0 auto}
.nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:16px;cursor:pointer;transition:transform .15s,background .2s,color .2s}
.nav button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.nav button.mid{background:var(--acc);color:#fff;transform:translateY(-10px) scale(1.05);box-shadow:0 8px 18px rgba(245,158,11,.4)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate3d(-50%,-90px,0);background:#0e1b26;color:#fff;padding:10px 18px;border-radius:99px;font-size:13.5px;z-index:60;transition:transform .3s cubic-bezier(.2,.9,.3,1);will-change:transform}.toast.on{transform:translate3d(-50%,0,0)}
.wrap{max-width:560px;margin:0 auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body *{visibility:hidden}#host,#host *{visibility:visible}#host{position:fixed;top:20px;left:0;right:0;padding:0 30px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><i><svg class="i" viewBox="0 0 24 24"><path d="M5 20V5a1 1 0 011-1h8a1 1 0 011 1v15M3 20h14M15 9h2a2 2 0 012 2v5a1.5 1.5 0 003 0V9l-3-3"/></svg></i><span id="orgT">منظومة الوقود</span></div>
  <button class="ib" onclick="openSet()" aria-label="الإعدادات"><svg class="i" viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6zM19 12h2M3 12h2M12 3v2M12 19v2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg></button>
</header>

<main>
<section id="s1" class="scr on">
  <div class="stats"><div class="stat"><b id="st1">0</b><span>البطاقات</span></div><div class="stat"><b id="st2">0</b><span>تعبئات اليوم</span></div><div class="stat"><b id="st3">0</b><span>مرفوضة اليوم</span></div></div>
  <div class="box"><h2>البطاقات الصادرة</h2><input id="q" placeholder="بحث بالرقم أو اللوحة أو الطراز" oninput="renderList()"><div id="list"></div></div>
</section>

<section id="s2" class="scr">
  <div class="box">
    <div class="dots"><i class="on" id="d1"></i><i id="d2"></i></div>
    <div class="card" id="pv"></div>
    <div id="f1">
      <label>رقم اللوحة / دفتر السيارة</label><input id="plate" oninput="pv()" inputmode="text">
      <label>الماركة والطراز</label><input id="model" oninput="pv()" placeholder="مثال: كيا K7">
      <label>سنة الصنع</label><input id="year" type="number" oninput="pv()" placeholder="2012">
      <button class="btn" onclick="step(2)">التالي</button>
    </div>
    <div id="f2" class="hide">
      <label>اللون</label><div class="chips" id="sw"></div>
      <label>نوع الوقود</label><div class="chips" id="fu"></div>
      <label>رقم الهيكل (اختياري)</label><input id="vin" oninput="pv()" style="direction:ltr">
      <div class="row"><button class="btn alt" onclick="step(1)">رجوع</button><button class="btn" onclick="issue()">إصدار البطاقة</button></div>
    </div>
  </div>
</section>

<section id="s3" class="scr">
  <div class="box">
    <div class="vf" id="vf"><video id="vid" class="hide" playsinline muted></video><span id="vh">الكاميرا متوقفة</span><i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="c c4"></i><i class="line"></i></div>
    <button class="btn" onclick="startCam()"><svg class="i" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M4 12h16"/></svg>تشغيل الكاميرا</button>
    <label class="btn alt" style="cursor:pointer;color:var(--tx);font-size:16px;margin-bottom:0">تصوير الرمز بالكاميرا<input type="file" accept="image/*" capture="environment" class="hide" onchange="readPhoto(this)"></label>
    <label>أو أدخل رقم البطاقة</label>
    <div class="row"><input id="code" placeholder="SBH-XXXXXXXX" style="direction:ltr;margin-top:0"><button class="btn" style="width:auto;margin-top:0;padding:0 20px" onclick="check($('code').value)">تحقق</button></div>
    <div class="gap"><button class="ib" onclick="gap(1)">+</button><b id="gv"></b><button class="ib" onclick="gap(-1)">−</button></div>
    <p class="mut" style="text-align:center;font-size:12px;color:var(--mut);margin:8px 0 0">الفاصل المسموح بين كل تعبئتين</p>
  </div>
</section>

<section id="s4" class="scr">
  <div class="box"><h2>سجل العمليات</h2>
    <div class="chips" style="margin-bottom:6px"><button class="chip on" onclick="flt('all',this)">الكل</button><button class="chip" onclick="flt('ok',this)">مقبولة</button><button class="chip" onclick="flt('no',this)">مرفوضة</button></div>
    <div id="log"></div>
    <div class="row"><button class="btn alt" onclick="csv()">نسخ CSV</button><button class="btn bad" onclick="wipe()">مسح الكل</button></div>
  </div>
</section>
</main>
</div>

<nav class="nav">
  <button class="on" onclick="go(1)"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>الرئيسية</button>
  <button onclick="go(2)"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>إصدار</button>
  <button class="mid" onclick="go(3)"><svg class="i" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M4 12h16"/></svg>مسح</button>
  <button onclick="go(4)"><svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>السجل</button>
</nav>
<div class="bk" id="bk" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const P={home:"M3 11l9-8 9 8M5 10v10h14V10",chk:"M5 12l5 5 9-10",x:"M6 6l12 12M18 6L6 18",lock:"M6 11h12v9H6zM8 11V8a4 4 0 018 0v3",trash:"M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13",eye:"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 100-6 3 3 0 000 6z",copy:"M9 9h11v11H9zM5 15V5h10",share:"M12 3v12M7 8l5-5 5 5M5 14v6h14v-6",print:"M6 9V3h12v6M6 18H4v-7h16v7h-2M7 14h10v7H7z",fuel:"M5 20V5a1 1 0 011-1h8a1 1 0 011 1v15M3 20h14M15 9h2a2 2 0 012 2v5a1.5 1.5 0 003 0V9l-3-3"};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let DB={cards:{},log:[],gap:3,org:'منظومة الوقود'};
try{const s=localStorage.getItem('fuelPro');if(s)DB=Object.assign(DB,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem('fuelPro',JSON.stringify(DB))}catch(e){}};
const COLORS=[['أبيض','#f5f5f5'],['أسود','#1a1a1a'],['رصاصي','#7b848c'],['فضي','#c3c8cd'],['أحمر','#c62828'],['أزرق','#1e56a0'],['أخضر','#2e7d4f'],['ذهبي','#c9a24a']];
const FUELS=['بنزين','ديزل','غاز'];
let color='رصاصي',fuel='بنزين',filter='all',stream=null,raf=0,busy=false;
const fmt=t=>new Date(t).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'});
const GAPMS=()=>DB.gap*864e5;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200)}
function buzz(){try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}
function go(n){stopCam();document.querySelectorAll('.scr').forEach((s,i)=>s.classList.toggle('on',i+1===n));
  document.querySelectorAll('.nav button').forEach((b,i)=>{if(!b.classList.contains('mid'))b.classList.toggle('on',i===n-1)});
  if(n===1)renderAll();if(n===2){step(1);pv()}if(n===3){$('gv').textContent=DB.gap+' أيام'}if(n===4)renderLog();window.scrollTo(0,0)}
function cardHTML(c,pre){return `<div class="top"><b>${ic('fuel')}${esc(DB.org)}</b><span>${esc(c.issued||'')}</span></div>
<div><span class="chipc"></span><div class="no">${esc(c.id)}</div></div>
<div class="mid"><div><div class="nm">${esc(c.model||'الماركة والطراز')} ${esc(c.year||'')}</div><div class="sub">${esc(c.plate||'رقم اللوحة')} · ${esc(c.color)} · ${esc(c.fuel)}${c.vin?'<br>'+esc(c.vin):''}</div></div><div class="qr" data-q="${esc(pre?'PREVIEW':c.id)}" style="${pre?'opacity:.55':''}"></div></div>`}
function mountQR(root){root.querySelectorAll('.qr').forEach(e=>{e.innerHTML='';new QRCode(e,{text:e.dataset.q,width:76,height:76,correctLevel:QRCode.CorrectLevel.M})})}
function draft(){return{id:'SBH-XXXXXXXX',plate:$('plate').value.trim(),model:$('model').value.trim(),year:$('year').value,color,fuel,vin:$('vin').value.trim(),issued:new Date().toISOString().slice(0,10)}}
let pvInit=false;
function pv(){const el=$('pv'),c=draft();if(!pvInit){el.innerHTML=cardHTML(c,true);mountQR(el);pvInit=true;return}
  const keep=el.querySelector('.qr');const tmp=document.createElement('div');tmp.innerHTML=cardHTML(c,true);
  tmp.querySelector('.qr').replaceWith(keep);el.replaceChildren(...tmp.childNodes)}
function step(n){$('f1').classList.toggle('hide',n!==1);$('f2').classList.toggle('hide',n!==2);$('d2').classList.toggle('on',n===2);
  $('f'+n).style.animation='none';$('f'+n).offsetHeight;$('f'+n).style.animation=''; $('f'+n).classList.add('scr','on')}
function buildPickers(){$('sw').innerHTML=COLORS.map(([n,h])=>`<div class="sw ${n===color?'on':''}" style="background:${h}" title="${n}" onclick="color='${n}';buildPickers();pv()"></div>`).join('');
  $('fu').innerHTML=FUELS.map(f=>`<button class="chip ${f===fuel?'on':''}" onclick="fuel='${f}';buildPickers();pv()">${f}</button>`).join('')}
function newId(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const a=new Uint32Array(8);crypto.getRandomValues(a);let s='';a.forEach(x=>s+=c[x%c.length]);return 'SBH-'+s}
function issue(){const c=draft();if(!c.model&&!c.plate){toast('أدخل الماركة أو رقم اللوحة');step(1);return}
  c.id=newId();c.last=null;c.active=true;DB.cards[c.id]=c;save();buzz();
  ['plate','model','year','vin'].forEach(i=>$(i).value='');pvInit=false;showCard(c.id,true)}
function showCard(id,fresh){const c=DB.cards[id];if(!c)return;
  $('sheet').innerHTML=`<div class="grab"></div><div id="host"><div class="card">${cardHTML(c)}</div></div>
  <p class="rs"><span style="color:var(--mut);font-size:12.5px">${fresh?'تم إصدار البطاقة بنجاح. ':''}يحتوي الرمز على رقم البطاقة فقط.</span></p>
  <div class="row"><button class="btn alt" onclick="copyId('${c.id}')">${ic('copy')}نسخ</button><button class="btn alt" onclick="shareId('${c.id}')">${ic('share')}مشاركة</button><button class="btn" onclick="window.print()">${ic('print')}طباعة</button></div>`;
  mountQR($('sheet'));openSheet()}
function copyId(id){try{navigator.clipboard.writeText(id).then(()=>toast('تم نسخ الرقم'),()=>toast(id))}catch(e){toast(id)}}
function shareId(id){try{navigator.share?navigator.share({title:'بطاقة وقود',text:id}):copyId(id)}catch(e){copyId(id)}}
function openSheet(){$('bk').classList.add('on');$('sheet').classList.add('on')}
function closeSheet(){$('bk').classList.remove('on');$('sheet').classList.remove('on');busy=false}
function state(c){if(!c.active)return['frozen','مجمّدة'];const now=Date.now();
  if(c.last&&now-c.last<GAPMS()){const l=c.last+GAPMS()-now;return['wait','بعد '+(l>=864e5?Math.floor(l/864e5)+' يوم':Math.ceil(l/36e5)+' س')]}return['ready','جاهزة']}
function renderAll(){const t=new Date().toDateString();
  $('st1').textContent=Object.keys(DB.cards).length;$('st2').textContent=DB.log.filter(l=>l.ok&&new Date(l.t).toDateString()===t).length;$('st3').textContent=DB.log.filter(l=>!l.ok&&new Date(l.t).toDateString()===t).length;renderList()}
function renderList(){const q=($('q').value||'').toLowerCase();
  const a=Object.values(DB.cards).filter(c=>(c.id+c.plate+c.model).toLowerCase().includes(q)).reverse();
  $('list').innerHTML=a.length?a.map(c=>{const[s,l]=state(c);return `<div class="item"><div class="av">${ic('fuel')}</div><div class="t"><b>${esc(c.model||c.plate)}</b><small>${esc(c.id)}</small></div><span class="bd ${s}">${l}</span>
  <div class="acts"><button class="ib" onclick="showCard('${c.id}')">${ic('eye')}</button><button class="ib" onclick="freeze('${c.id}')">${ic('lock')}</button><button class="ib" onclick="del('${c.id}')">${ic('trash')}</button></div></div>`}).join(''):'<div class="empty">لا توجد بطاقات. اضغط «إصدار» لإنشاء أول بطاقة.</div>'}
function freeze(id){const c=DB.cards[id];c.active=!c.active;save();renderAll();toast(c.active?'تم تفعيل البطاقة':'تم تجميد البطاقة')}
function ask(msg,fn){window._cb=fn;$('sheet').innerHTML=`<div class="grab"></div><div class="rs"><h3>${msg}</h3></div><div class="row"><button class="btn alt" onclick="closeSheet()">إلغاء</button><button class="btn bad" onclick="closeSheet();window._cb()">تأكيد</button></div>`;openSheet()}
function del(id){ask('حذف هذه البطاقة؟',()=>{delete DB.cards[id];save();renderAll();toast('تم الحذف')})}
async function startCam(){try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('vid');v.srcObject=stream;v.classList.remove('hide');$('vh').classList.add('hide');await v.play();scan()}catch(e){stopCam();$('vh').innerHTML='الكاميرا المباشرة محجوبة هنا<br>استخدم زر «تصوير الرمز» بالأسفل';toast('تعذّر تشغيل الكاميرا المباشرة')}}
function readPhoto(inp){const f=inp.files[0];if(!f)return;const img=new Image();img.onload=()=>{const s=Math.min(1,1000/Math.max(img.width,img.height));cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cx.drawImage(img,0,0,cv.width,cv.height);const r=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);URL.revokeObjectURL(img.src);inp.value='';if(r&&r.data)check(r.data);else toast('لم يتم قراءة الرمز، أعد التصوير بوضوح')};img.src=URL.createObjectURL(f)}
function stopCam(){cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('vid').classList.add('hide');$('vh').classList.remove('hide')}
const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let fr=0;
function scan(){const v=$('vid');if(v.readyState===4&&++fr%3===0){const w=v.videoWidth>640?640:v.videoWidth,h=Math.round(w*v.videoHeight/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);
  const r=jsQR(cx.getImageData(0,0,w,h).data,w,h);if(r&&r.data&&!busy){stopCam();buzz();check(r.data);return}}raf=requestAnimationFrame(scan)}
function gap(d){DB.gap=Math.min(30,Math.max(0,DB.gap+d));$('gv').textContent=DB.gap+' أيام';save()}
function check(raw){const id=(raw||'').trim().toUpperCase(),c=DB.cards[id],now=Date.now();busy=true;let h;
  if(!c){h=`<div class="rs"><div class="big no"><svg class="i" viewBox="0 0 24 24"><path d="${P.x}"/></svg></div><h3>بطاقة غير معروفة</h3><p style="direction:ltr">${esc(id||'—')}</p></div><button class="btn alt" onclick="closeSheet()">إغلاق</button>`}
  else if(!c.active){log(id,false);h=`<div class="rs"><div class="big no"><svg class="i" viewBox="0 0 24 24"><path d="${P.lock}"/></svg></div><h3>البطاقة مجمّدة</h3><p>${esc(c.model)} · ${esc(c.plate)}</p></div><button class="btn alt" onclick="closeSheet()">إغلاق</button>`}
  else if(c.last&&now-c.last<GAPMS()){const l=c.last+GAPMS()-now;log(id,false);
    h=`<div class="rs"><div class="big no"><svg class="i" viewBox="0 0 24 24"><path d="${P.x}"/></svg></div><h3>غير مسموح بالتعبئة</h3><p>${esc(c.model)} · ${esc(c.plate)}</p><p>آخر تعبئة: ${fmt(c.last)}</p><p>المتبقي: ${Math.floor(l/864e5)} يوم و${Math.ceil(l%864e5/36e5)} ساعة</p><p>الموعد القادم: ${fmt(c.last+GAPMS())}</p></div><button class="btn alt" onclick="closeSheet()">إغلاق</button>`}
  else{h=`<div class="rs"><div class="big ok"><svg class="i" viewBox="0 0 24 24"><path d="${P.chk}"/></svg></div><h3>مسموح بالتعبئة</h3><p>${esc(c.model)} · ${esc(c.plate)} · ${esc(c.fuel)}</p><p>${c.last?'آخر تعبئة: '+fmt(c.last):'أول تعبئة لهذه البطاقة'}</p></div>
    <label>الكمية (لتر)</label><input id="qty" type="number" inputmode="numeric" placeholder="40"><div class="chips" style="margin-top:10px">${[20,30,40,60].map(n=>`<button class="chip" onclick="$('qty').value=${n}">${n}</button>`).join('')}</div>
    <button class="btn" onclick="fill('${id}')">${ic('chk')}تسجيل التعبئة</button><button class="btn alt" onclick="closeSheet()">إلغاء</button>`}
  $('sheet').innerHTML='<div class="grab"></div>'+h;openSheet()}
function log(id,ok,qty){DB.log.unshift({t:Date.now(),id,ok,qty});DB.log=DB.log.slice(0,500);save()}
function fill(id){const q=$('qty').value||'';DB.cards[id].last=Date.now();log(id,true,q);buzz();closeSheet();$('code').value='';toast('تم تسجيل التعبئة ✓')}
function flt(f,b){filter=f;document.querySelectorAll('#s4 .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderLog()}
function renderLog(){const a=DB.log.filter(l=>filter==='all'||(filter==='ok')===l.ok);
  $('log').innerHTML=a.length?a.slice(0,100).map(l=>`<div class="item"><div class="av" style="${l.ok?'':'background:rgba(211,59,59,.14);color:var(--bad)'}">${ic(l.ok?'chk':'x')}</div><div class="t"><b>${l.ok?'تعبئة '+(l.qty?l.qty+' لتر':''):'عملية مرفوضة'}</b><small>${esc(l.id)}</small></div><small style="color:var(--mut);font-size:11.5px">${fmt(l.t)}</small></div>`).join(''):'<div class="empty">لا توجد عمليات.</div>'}
function csv(){const t='time,card,result,liters\n'+DB.log.map(l=>[new Date(l.t).toISOString(),l.id,l.ok?'ok':'denied',l.qty||''].join(',')).join('\n');copyId(t);toast('تم نسخ السجل')}
function wipe(){ask('حذف كل البطاقات والسجل؟',()=>{DB.cards={};DB.log=[];save();renderLog();renderAll();toast('تم المسح')})}
function openSet(){$('sheet').innerHTML=`<div class="grab"></div><h2>الإعدادات</h2><label>اسم الجهة (يظهر على البطاقة)</label><input id="org" value="${esc(DB.org)}"><button class="btn" onclick="DB.org=$('org').value||'منظومة الوقود';$('orgT').textContent=DB.org;save();pvInit=false;closeSheet();toast('تم الحفظ')">حفظ</button>`;openSheet()}
$('orgT').textContent=DB.org;buildPickers();renderAll();
</script>
</body>
</html>
